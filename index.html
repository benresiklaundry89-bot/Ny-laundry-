<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NY Laundry — Pembukuan</title>
<style>
:root{--bg:#fff7fb;--sf:#fff;--ink:#241d24;--mu:#857a84;--ln:#f1e4ec;--pr:#ff3e7a;--gr:linear-gradient(135deg,#ff7a18 0%,#ff3e7a 50%,#8a4fff 100%);--ok:#059669;--okb:#ecfdf5;--wn:#ea580c;--wnb:#fff7ed;--pu:#7e22ce;--pub:#faf5ff;--er:#b91c1c;--erb:#fef2f2}
@media(prefers-color-scheme:dark){:root{--bg:#1d131b;--sf:#2a1f28;--ink:#fff7fb;--mu:#c6b7c1;--ln:#4a3646;--okb:#12352a;--wnb:#3a2616;--pub:#2f2038;--erb:#3b1b1b;--er:#fca5a5;--ok:#6ee7b7;--wn:#fdba74;--pu:#d8b4fe}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 14px 0}
.top{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--gr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.top b{font-size:15px;display:block}.top small{color:var(--mu);font-size:11px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--gr);color:#fff;border-color:transparent}
main{max-width:1100px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 8px;font-size:16px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}.cols2{grid-template-columns:1fr 1fr}}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.big{font-size:22px;font-weight:800;margin-top:4px}
.mu{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}
.dark{background:#18181b;color:#fff;border-color:#18181b}.dark .lbl,.dark .mu{color:#d4d4d8}
.grad{background:var(--gr);color:#fff;border:0}.grad .lbl{color:#ffffffcc}
label.f{display:block;margin-bottom:10px}label.f>span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mu);margin-bottom:4px;text-transform:uppercase}
input,select,textarea{width:100%;min-height:46px;touch-action:manipulation;}
select,input[type=date]{cursor:pointer;position:relative;z-index:1;}
label.f{position:relative;z-index:1;}padding:10px 12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pr)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
textarea{resize:vertical;min-height:70px}textarea.mono{font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre;overflow:auto}
.btn{min-height:46px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--ln);background:var(--sf);font-weight:700;cursor:pointer}
.btn.p{background:var(--gr);color:#fff;border-color:transparent}.btn.d{background:#18181b;color:#fff;border-color:#18181b}.btn.r{background:#dc2626;color:#fff;border-color:#dc2626}
.btn.s{min-height:36px;padding:6px 12px;font-size:12px}.btn.w{width:100%}.btn[disabled]{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.grow{flex:1}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--ln)}
.b-ok{background:var(--okb);color:var(--ok)}.b-wn{background:var(--wnb);color:var(--wn)}.b-pu{background:var(--pub);color:var(--pu)}
.note{border-radius:12px;padding:10px 12px;font-size:12px;margin:8px 0;background:var(--wnb);color:var(--wn)}
.note.ok{background:var(--okb);color:var(--ok)}.note.pu{background:var(--pub);color:var(--pu)}.note.er{background:var(--erb);color:var(--er)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.kv.t{border-top:1px solid var(--ln);margin-top:4px;padding-top:8px;font-weight:800}
.tx{cursor:pointer}.tx:active{transform:scale(.995)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;text-align:left;color:var(--mu);padding:8px}td{padding:8px;border-top:1px solid var(--ln);vertical-align:top}td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;overflow-x:auto}.bar{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mu)}
.bar i{display:block;width:9px;border-radius:5px 5px 0 0;min-height:2px}.pair{display:flex;align-items:flex-end;gap:2px;flex:1}
#modal{position:fixed;inset:0;z-index:50;display:none;background:#0006;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--sf);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
@media(min-width:760px){#modal{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 10px;font-size:18px}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:90;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:520px;margin:0 auto}
.tst{pointer-events:auto;background:#059669;color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;box-shadow:0 8px 24px #0004;display:flex;gap:10px;justify-content:space-between;align-items:center}
.tst.er{background:#dc2626}.tst button{border:0;background:#fff3;color:#fff;border-radius:999px;padding:4px 12px;font-weight:700}
#cloud{position:fixed;right:8px;bottom:8px;z-index:30;font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;background:#fef3c7;color:#92400e;max-width:75vw;box-shadow:0 2px 8px #0002}
#cloud.ok{background:#dcfce7;color:#166534}
details summary{cursor:pointer;font-weight:700}
pre.sql{white-space:pre-wrap;font-size:11px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="cloud">Memuat…</div>
<script type="module">
/* =========================================================
   NY Laundry — versi bersih
   Prinsip: status LUNAS, SISA, dan TANGGAL LUNAS selalu DIHITUNG
   dari riwayat pembayaran (tidak disimpan terpisah), sehingga
   tidak mungkin saling bertentangan.
   ========================================================= */
const MONTHS=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const EXP_CATS=["Sabun","Pewangi","Plastik","Listrik","Air","Gaji","Sewa","Lain-lain"];
const REFUND="Pengembalian Kelebihan";
const DEF_PRICES=[{key:"Cuci Kering",harga:7000,satuan:"/kg"},{key:"Cuci Setrika",harga:9000,satuan:"/kg"},{key:"Setrika Saja",harga:6000,satuan:"/kg"},{key:"Satuan",harga:15000,satuan:"/pcs"},{key:"Bedcover",harga:25000,satuan:"/pcs"},{key:"Karpet",harga:30000,satuan:"/m2"}];
const DEF_PROFILE={nama:"NY LAUNDRY",alamat:"",wa:"",slogan:"CLEAN • FRESH • FAST"};
const CFG_KEY="ny_laundry_cloud_config_v1";

/* ---------- util ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp "+new Intl.NumberFormat("id-ID").format(Math.round(n||0));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; // tanggal LOKAL (bukan UTC)
const today=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=String(s||today()).split("-").map(Number);return{y,m,d}};
const addDays=(s,n)=>{const p=parse(s);return ymd(new Date(p.y,p.m-1,p.d+n))};
const dim=(y,m)=>new Date(y,m,0).getDate();
const fmt=s=>{if(!s)return"-";const p=parse(s);return`${pad(p.d)}/${pad(p.m)}/${p.y}`};
const fmtL=s=>{const p=parse(s);return`${pad(p.d)} ${MONTHS[p.m-1]} ${p.y}`};
const sum=(a,f)=>a.reduce((x,i)=>x+(+f(i)||0),0);
const uid=p=>`${p}-${Date.now().toString(36).toUpperCase()}${Math.random().toString(36).slice(2,6).toUpperCase()}`;
const digits=s=>String(s||"").replace(/\D/g,"");
const ckey=(n,h)=>`${String(n||"").trim().toLowerCase()}|${digits(h)}`;
const val=id=>{const e=document.getElementById(id);return e?e.value:""};

/* ---------- penyimpanan + cloud ---------- */
const cloud={client:null,user:null};
function setCloud(msg,ok){const e=$("#cloud");e.textContent=msg;e.className=ok?"ok":""}
function load(k,f){try{const r=localStorage.getItem("ny_laundry_"+k);if(r===null)return f;const v=JSON.parse(r);return v===null?f:v}catch{return f}}
function save(k,v){
  try{localStorage.setItem("ny_laundry_"+k,JSON.stringify(v))}catch(e){toast("Penyimpanan HP penuh — data gagal disimpan. Export CSV segera.",1)}
  if(cloud.client&&cloud.user){const p=load("pending_sync",{});p[k]=v;try{localStorage.setItem("ny_laundry_pending_sync",JSON.stringify(p))}catch{}flushPending()}
}
let flushing=false;
async function flushPending(){
  if(!cloud.client||!cloud.user||flushing)return;
  if(!navigator.onLine){setCloud("Offline — perubahan menunggu sinkronisasi");return}
  flushing=true;
  try{
    for(const[k,v]of Object.entries(load("pending_sync",{}))){
      const{error}=await cloud.client.from("ny_laundry_data").upsert({user_id:cloud.user.id,data_key:k,payload:v,updated_at:new Date().toISOString()},{onConflict:"user_id,data_key"});
      if(error)throw error;
      const cur=load("pending_sync",{});
      if(JSON.stringify(cur[k])===JSON.stringify(v)){delete cur[k];localStorage.setItem("ny_laundry_pending_sync",JSON.stringify(cur))}
    }
    setCloud("Tersinkron • "+new Date().toLocaleTimeString("id-ID"),1);
  }catch(e){console.warn(e);setCloud("Gagal sinkron — data tetap aman di HP")}
  flushing=false;
}
async function cloudStart(){
  let cfg=null;try{cfg=JSON.parse(localStorage.getItem(CFG_KEY)||"null")}catch{}
  if(!cfg?.url||!cfg?.anonKey){setCloud("Mode lokal — cloud belum dihubungkan");return}
  try{
    // import dinamis: kalau offline, aplikasi TETAP jalan (versi lama mati total)
    const{createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
    cloud.client=createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
    const{data:{session}}=await cloud.client.auth.getSession();
    if(!session){setCloud("Cloud: belum login — buka Pengaturan");return}
    cloud.user=session.user;
    await flushPending(); // dorong perubahan lokal DULU supaya tidak tertimpa data cloud lama
    const{data,error}=await cloud.client.from("ny_laundry_data").select("data_key,payload").eq("user_id",session.user.id);
    if(error)throw error;
    const pend=load("pending_sync",{});
    for(const r of data||[])if(!(r.data_key in pend))localStorage.setItem("ny_laundry_"+r.data_key,JSON.stringify(r.payload));
    setCloud("Cloud terhubung • "+(session.user.email||"akun"),1);
    window.addEventListener("online",flushPending);
  }catch(e){console.warn(e);setCloud("Cloud belum siap — data lokal aktif")}
}

/* ---------- state ---------- */
let S;
function normTx(t){
  let pays=(t.payments||[]).map(p=>({id:p.id||uid("PAY"),tanggal:p.tanggal||t.tanggal,nominal:+p.nominal||0,metode:p.metode||t.metode||"Cash",ket:p.ket||p.keterangan||"",kelebihanJadiDP:+p.kelebihanJadiDP||0,kembalian:p.kembalian===undefined?undefined:+p.kembalian}));
  if(!pays.length&&+t.dp>0)pays=[{id:uid("PAY"),tanggal:t.tanggal,nominal:+t.dp,metode:t.metode||"Cash",ket:"Pembayaran awal",kelebihanJadiDP:+t.kelebihanDP||0,kembalian:0}];
  if(pays.some(p=>p.kembalian===undefined)){
    pays.forEach(p=>{if(p.kembalian===undefined)p.kembalian=0});
    const kb=+t.kembalian||0;
    if(kb>0&&pays.length){const p=pays[pays.length-1];p.kembalian=Math.min(kb,Math.max(0,p.nominal-p.kelebihanJadiDP))}
  }
  let st=t.status;if(!["Proses","Selesai","Diambil"].includes(st))st=t.tanggalDiambil?"Diambil":"Selesai";
  return{id:t.id,tanggal:t.tanggal||today(),pelanggan:t.pelanggan||"",hp:t.hp||"",layanan:t.layanan||"",qty:+t.qty||0,harga:+t.harga||0,items:Array.isArray(t.items)&&t.items.length?t.items.map(i=>({key:i.key||i.layanan||"",qty:+i.qty||0,harga:+i.harga||0,satuan:i.satuan||""})):[{key:t.layanan||"",qty:+t.qty||0,harga:+t.harga||0,satuan:""}],diskon:+t.diskon||0,ongkir:+t.ongkir||0,total:+t.total||0,dpTerpakai:+t.dpTerpakai||0,metode:t.metode||"Cash",status:st,tanggalDiambil:t.tanggalDiambil||"",payments:pays};
}
function loadState(){
  const prices=load("prices",DEF_PRICES);
  S={tx:load("transactions",[]).map(normTx),exp:load("expenses",[]),dp:load("dp",[]),profile:{...DEF_PROFILE,...load("profile",{})},prices:Array.isArray(prices)&&prices.length?prices:DEF_PRICES,cutoff:+load("closing_day",26)||0,recaps:load("recaps",[])};
}
function persist(...ks){const m={transactions:S.tx,expenses:S.exp,dp:S.dp,profile:S.profile,prices:S.prices,closing_day:S.cutoff,recaps:S.recaps};ks.forEach(k=>save(k,m[k]))}

/* ---------- perhitungan inti ---------- */
const applied=p=>Math.max(0,(p.nominal||0)-(p.kelebihanJadiDP||0)-(p.kembalian||0));
const paidAll=t=>(t.dpTerpakai||0)+sum(t.payments,applied);
const sisa=t=>Math.max(0,t.total-paidAll(t));
const isLunas=t=>sisa(t)<=0;
function lunasDate(t){
  if(!isLunas(t))return"";
  let acc=t.dpTerpakai||0;if(acc>=t.total)return t.tanggal;
  for(const p of[...t.payments].sort((a,b)=>a.tanggal.localeCompare(b.tanggal))){acc+=applied(p);if(acc>=t.total)return p.tanggal}
  return t.tanggal;
}
const paidUpTo=(t,D)=>(t.tanggal<=D?t.dpTerpakai||0:0)+sum(t.payments.filter(p=>p.tanggal<=D),applied);
const lastPay=t=>[...t.payments].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).pop();
const dpSaldo=(n,h)=>{const k=ckey(n,h);return sum(S.dp.filter(r=>ckey(r.pelanggan,r.hp)===k),r=>r.jenis==="Masuk"?r.jumlah:-r.jumlah)};
const kekuranganSaldo=(n,h)=>{const k=ckey(n,h);if(!n)return 0;return sum(S.tx.filter(x=>ckey(x.pelanggan,x.hp)===k),x=>sisa(x))};
const kekuranganList=(n,h)=>{const k=ckey(n,h);if(!n)return [];return S.tx.filter(x=>ckey(x.pelanggan,x.hp)===k&&sisa(x)>0).sort((a,b)=>a.tanggal.localeCompare(b.tanggal))};
function dpList(){
  const m=new Map();
  S.dp.forEach(r=>{const k=ckey(r.pelanggan,r.hp);const c=m.get(k)||{key:k,nama:r.pelanggan,hp:r.hp,saldo:0,last:r.tanggal,recs:[]};c.saldo+=r.jenis==="Masuk"?r.jumlah:-r.jumlah;if(r.tanggal>c.last)c.last=r.tanggal;c.recs.push(r);m.set(k,c)});
  return[...m.values()].sort((a,b)=>b.saldo-a.saldo);
}
const dpHeld=()=>sum(dpList(),c=>Math.max(0,c.saldo));
const cashIn=up=>sum(S.tx,t=>sum(t.payments.filter(p=>!up||p.tanggal<=up),p=>p.nominal-p.kembalian))+sum(S.dp.filter(r=>r.jenis==="Masuk"&&!r.transaksiId&&(!up||r.tanggal<=up)),r=>r.jumlah);
const cashOut=up=>sum(S.exp.filter(e=>!up||e.tanggal<=up),e=>e.jumlah);
const saldoKas=()=>cashIn()-cashOut();
const customers=()=>{
  const m=new Map();
  S.tx.forEach(t=>{const k=ckey(t.pelanggan,t.hp);const c=m.get(k)||{key:k,nama:t.pelanggan,hp:t.hp,count:0,total:0,sisa:0,last:t.tanggal};c.count++;c.total+=t.total;c.sisa+=sisa(t);if(t.tanggal>c.last)c.last=t.tanggal;m.set(k,c)});
  return[...m.values()].map(c=>({...c,dp:dpSaldo(c.nama,c.hp)})).sort((a,b)=>b.total-a.total);
};
function nextId(){const n=Math.max(0,...S.tx.map(t=>{const m=/^NY-(\d+)$/.exec(t.id);return m?+m[1]:0}));return"NY-"+String(n+1).padStart(3,"0")}

/* periode rekap (tanggal tutup 1–28, 0 = akhir bulan) */
function period(m,y,c){
  if(!c)return{start:`${y}-${pad(m)}-01`,end:`${y}-${pad(m)}-${pad(dim(y,m))}`};
  const pm=m===1?12:m-1,py=m===1?y-1:y;
  return{start:addDays(`${py}-${pad(pm)}-${pad(c)}`,1),end:`${y}-${pad(m)}-${pad(c)}`};
}
function periodOf(date,c){const p=parse(date);if(!c||p.d<=c)return{m:p.m,y:p.y};return p.m===12?{m:1,y:p.y+1}:{m:p.m+1,y:p.y}}
const mlabel=(m,y)=>`${MONTHS[m-1]} ${y}`;

/* semua angka laporan untuk satu rentang tanggal */
function calc(start,end){
  const inP=d=>!!d&&d>=start&&d<=end;
  const notaP=S.tx.filter(t=>inP(t.tanggal));
  const lunasP=S.tx.filter(t=>inP(lunasDate(t)));
  const expP=S.exp.filter(e=>inP(e.tanggal));
  const dpP=S.dp.filter(r=>inP(r.tanggal));
  const before=addDays(start,-1);
  const piutangAwal=sum(S.tx.filter(t=>t.tanggal<start),t=>Math.max(0,t.total-paidUpTo(t,before)));
  const piutangAkhir=sum(S.tx.filter(t=>t.tanggal<=end),t=>Math.max(0,t.total-paidUpTo(t,end)));
  const tagihan=sum(notaP,t=>t.total);
  const dpAkhir=sum(S.dp.filter(r=>r.tanggal<=end),r=>r.jenis==="Masuk"?r.jumlah:-r.jumlah);
  const dpHeldEnd=sum(dpList().length?(()=>{const m=new Map();S.dp.filter(r=>r.tanggal<=end).forEach(r=>{const k=ckey(r.pelanggan,r.hp);m.set(k,(m.get(k)||0)+(r.jenis==="Masuk"?r.jumlah:-r.jumlah))});return[...m.values()]})():[],x=>Math.max(0,x));
  const pemasukanKas=sum(lunasP,t=>t.total);
  const beban=sum(expP.filter(e=>e.kategori!==REFUND),e=>e.jumlah);
  const pengembalian=sum(expP.filter(e=>e.kategori===REFUND),e=>e.jumlah);
  const kasSampai=cashIn(end)-cashOut(end);
  return{start,end,notaP,lunasP,expP,pemasukanKas,tagihan,beban,pengembalian,
    labaKas:pemasukanKas-beban,labaTagihan:tagihan-beban,
    piutangAwal,piutangAkhir,pembayaran:piutangAwal+tagihan-piutangAkhir,
    susulan:lunasP.filter(t=>t.tanggal<start),
    piutangPeriode:notaP.map(t=>({...t,paid:paidUpTo(t,end),sisaEnd:Math.max(0,t.total-paidUpTo(t,end))})).filter(t=>t.sisaEnd>0),
    dpMasuk:sum(dpP.filter(r=>r.jenis==="Masuk"),r=>r.jumlah),dpPakai:sum(dpP.filter(r=>r.jenis==="Dipakai Otomatis"),r=>r.jumlah),dpKembali:sum(dpP.filter(r=>r.jenis==="Dikembalikan"),r=>r.jumlah),dpAkhir,
    orderCount:notaP.length,lunasCount:lunasP.length,belumLunas:notaP.filter(t=>t.total-paidUpTo(t,end)>0).length,
    kasSampai,kasBersih:kasSampai-dpHeldEnd};
}

/* ---------- toast / modal ---------- */
function toast(msg,err,undo){
  const el=document.createElement("div");el.className="tst"+(err?" er":"");
  el.innerHTML=`<span>${esc(msg)}</span>`;
  if(undo){const b=document.createElement("button");b.textContent="Urungkan";b.onclick=()=>{undo();el.remove()};el.appendChild(b)}
  $("#toast").appendChild(el);setTimeout(()=>el.remove(),undo?10000:4500);
}

/* ---------- struk thermal 58mm (32 karakter) ---------- */
const W=32,LINE="-".repeat(W);
const clean=s=>String(s??"").replace(/[•·]/g,"-").replace(/[—–]/g,"-").replace(/→/g,"->").replace(/[^\x20-\x7E\n]/g,"").replace(/\s+/g," ").trim();
function wrap(s,w=W){s=clean(s);if(!s)return[""];const out=[];let cur="";for(let word of s.split(" ")){while(word.length>w){if(cur){out.push(cur);cur=""}out.push(word.slice(0,w));word=word.slice(w)}const t=cur?cur+" "+word:word;if(t.length<=w)cur=t;else{out.push(cur);cur=word}}if(cur)out.push(cur);return out}
const kvl=(k,v)=>{const l=`${clean(k)}: ${clean(v)}`;return l.length<=W?[l]:[clean(k)+":",...wrap(v)]};
const center=s=>{s=clean(s).slice(0,W);return" ".repeat(Math.floor((W-s.length)/2))+s};
function receipt(t){
  const p=S.profile,sub=t.qty*t.harga,lp=lastPay(t),per=lunasDate(t)?periodOf(lunasDate(t),S.cutoff):null;
  const L=[center(p.nama||"-"),...wrap(p.alamat||"-"),...wrap(p.wa?"WA: "+p.wa:"WA: -"),LINE,
    ...kvl("NOTA",t.id),...kvl("Tanggal",fmt(t.tanggal)),...kvl("Pelanggan",t.pelanggan||"-"),...kvl("HP",t.hp||"-"),LINE,
    ...(t.items?.length?t.items.flatMap(i=>[...wrap(`${i.key} — ${i.qty} x ${rp(i.harga)}`),...kvl(`${i.qty} x ${rp(i.harga)}`,rp(i.qty*i.harga))]):[...wrap(t.layanan),...kvl(`${t.qty} x ${rp(t.harga)}`,rp(sub))]),...kvl("Diskon","-"+rp(t.diskon)),...kvl("Ongkir",rp(t.ongkir)),...kvl("Kelebihan Terpakai","-"+rp(t.dpTerpakai)),LINE,
    ...kvl("TOTAL",rp(t.total)),...kvl("Sudah Dibayar",rp(paidAll(t))),...kvl("SISA",rp(sisa(t))),...kvl("Status Bayar",isLunas(t)?"LUNAS":"BELUM LUNAS"),...kvl("Saldo Kelebihan",rp(dpSaldo(t.pelanggan,t.hp))),LINE,
    ...kvl("Bayar Terakhir",lp?fmt(lp.tanggal):"-"),...kvl("Masuk Rekap",per?mlabel(per.m,per.y):"Belum (piutang)"),...kvl("Pengambilan",t.tanggalDiambil?fmt(t.tanggalDiambil):"Belum diambil"),...kvl("Status",t.status)];
  if(t.payments.length){L.push(LINE,"Riwayat Bayar:");t.payments.forEach(x=>L.push(`${fmt(x.tanggal)} - ${rp(x.nominal)}`))}
  L.push(LINE,"Terima kasih telah laundry",...wrap("di "+(p.nama||"-")+"."),"Komplain max 24 jam.",LINE);
  return L.join("\n");
}
function rawbt(text){
  if(!/Android/i.test(navigator.userAgent)){copyText(text,"Struk tersalin — tempel di RawBT");return}
  try{const b=new TextEncoder().encode(text);let s="";for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));window.location.href="rawbt:base64,"+btoa(s);toast("Dikirim ke RawBT")}catch{copyText(text,"Struk tersalin")}
}

function txFiltered(){
  const q=UI.q.toLowerCase();
  return S.tx.filter(t=>{
    if(q&&!t.pelanggan.toLowerCase().includes(q)&&!t.id.toLowerCase().includes(q)&&!digits(t.hp).includes(digits(q)||"@@"))return false;
    if(UI.fbayar==="lunas"&&!isLunas(t))return false;
    if(UI.fbayar==="belum"&&isLunas(t))return false;
    if(UI.fstat&&t.status!==UI.fstat)return false;
    if(UI.fbulan&&!t.payments.some(p=>p.tanggal.slice(0,7)===UI.fbulan))return false;
    return true;
  }).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||b.id.localeCompare(a.id));
}

function payPreview(){
  const t=S.tx.find(x=>x.id===M.id),b=$("#pay-prev");if(!t||!b)return;
  const s=sisa(t),n=+val("pay-nom")||0,ex=Math.max(0,n-s),act=document.querySelector("input[name=pay-ex]:checked")?.value||"dp";
  let h="";
  if(n>0&&n<s)h=`<div class="note">Sisa setelah ini ${rp(s-n)} • tetap Belum Lunas.</div>`;
  else if(n>=s&&n>0)h=`<div class="note ok">Akan LUNAS${ex>0?` • kelebihan ${rp(ex)}`:" (pas)"}.</div>`;
  if(ex>0)h+=`<div class="lbl">Kelebihan ${rp(ex)} mau diapakan?</div>
   <label class="row sm" style="padding:6px 0"><input type="radio" name="pay-ex" value="dp" ${act==="dp"?"checked":""}> Ditinggal di laundry → jadi kelebihan bayar (disarankan)</label>
   <label class="row sm" style="padding:6px 0"><input type="radio" name="pay-ex" value="kembalikan" ${act==="kembalikan"?"checked":""}> Kembalikan tunai (kembalian)</label>
   <div class="note pu">Saldo kelebihan ${esc(t.pelanggan)} setelah ini: ${rp(dpSaldo(t.pelanggan,t.hp)+(act==="dp"?ex:0))}</div>`;
  const keep=document.querySelector("input[name=pay-ex]:checked")?.value;b.innerHTML=h;if(keep){const r=document.querySelector(`input[name=pay-ex][value=${keep}]`);if(r)r.checked=true}
  const am=$("#pay-ambil");if(am&&n>=s&&n>0&&!am.dataset.touched)am.checked=true;
}
function paySave(){
  const t=S.tx.find(x=>x.id===M.id);if(!t)return;
  const s=sisa(t),n=+val("pay-nom")||0,tgl=val("pay-tgl")||today();
  if(!(n>0))return toast("Nominal harus lebih dari 0.",1);
  if(tgl>today())return toast("Tanggal pembayaran tidak boleh di masa depan.",1);
  if(tgl<t.tanggal)return toast("Tanggal pembayaran tidak boleh sebelum tanggal nota.",1);
  const ap=Math.min(n,s),ex=n-ap,act=document.querySelector("input[name=pay-ex]:checked")?.value||"dp";
  t.payments.push({id:uid("PAY"),tanggal:tgl,nominal:n,metode:val("pay-met"),ket:ap>=s?"Pelunasan":"Cicilan",kelebihanJadiDP:ex>0&&act==="dp"?ex:0,kembalian:ex>0&&act==="kembalikan"?ex:0});
  if(ex>0&&act==="dp")S.dp.unshift({id:uid("DP"),tanggal:tgl,pelanggan:t.pelanggan,hp:t.hp,jenis:"Masuk",jumlah:ex,ket:`Kelebihan masuk — kelebihan bayar ${t.id}`,transaksiId:t.id});
  if($("#pay-ambil")?.checked){t.status="Diambil";t.tanggalDiambil=tgl}
  persist("transactions","dp");
  toast(ap>=s?`Nota ${t.id} LUNAS.${ex>0?(act==="dp"?` Kelebihan ${rp(ex)} jadi DP.`:` Kembalian ${rp(ex)}.`):""}`:`Pembayaran ${rp(n)} dicatat. Sisa ${rp(s-n)}.`);
  render();showDetail(t.id);
}

const editTotal=()=>Math.max(0,(+val("e-qty")||0)*(+val("e-harga")||0)-(+val("e-diskon")||0)+(+val("e-ongkir")||0));
function editPreview(){const t=S.tx.find(x=>x.id===M.id);if(!t||!$("#e-total"))return;const n=editTotal();$("#e-total").textContent=rp(n);$("#e-sisa").textContent=rp(Math.max(0,n-paidAll(t)))}
function editSave(){
  const t=S.tx.find(x=>x.id===M.id);if(!t)return;
  const nama=val("e-nama").trim(),qty=+val("e-qty")||0,harga=+val("e-harga")||0,diskon=+val("e-diskon")||0,ongkir=+val("e-ongkir")||0,tgl=val("e-tgl")||t.tanggal;
  if(!nama)return toast("Nama wajib diisi.",1);
  if(!(qty>0))return toast("Qty harus lebih dari 0.",1);
  if(diskon<0||ongkir<0||harga<0)return toast("Nilai tidak boleh negatif.",1);
  if(diskon>qty*harga)return toast("Diskon melebihi subtotal.",1);
  const total=editTotal(),paid=paidAll(t);
  if(paid>total)return toast(`Total baru ${rp(total)} lebih kecil dari yang sudah dibayar ${rp(paid)}. Hapus nota atau sesuaikan.`,1);
  const first=t.payments.map(p=>p.tanggal).sort()[0];
  if(first&&tgl>first)return toast("Tanggal nota tidak boleh setelah tanggal pembayaran pertama.",1);
  Object.assign(t,{pelanggan:nama,hp:val("e-hp").trim(),layanan:val("e-lay"),qty,harga,diskon,ongkir,total,tanggal:tgl,metode:val("e-met")});
  S.dp.forEach(r=>{if(r.transaksiId===t.id){r.pelanggan=t.pelanggan;r.hp=t.hp}});
  persist("transactions","dp");toast(`Nota ${t.id} diperbarui.`);render();showDetail(t.id);
}
async function delTx(id){
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  const n=S.dp.filter(r=>r.transaksiId===id).length;
  if(!await ask("Hapus transaksi?",`${t.id} • ${t.pelanggan} • ${rp(t.total)}. ${n} catatan kelebihan terkait ikut terhapus.`,"Ya, Hapus")){return}
  closeModal();
  const snap={tx:[...S.tx],dp:[...S.dp]};
  S.tx=S.tx.filter(x=>x.id!==id);S.dp=S.dp.filter(r=>r.transaksiId!==id);persist("transactions","dp");render();
  toast(`${id} dihapus`,0,()=>{S.tx=snap.tx;S.dp=snap.dp;persist("transactions","dp");render()});
}

function dpAdd(){
  const nama=val("d-nama").trim(),hp=val("d-hp").trim(),n=+val("d-nom")||0,tgl=val("d-tgl")||today();
  if(!nama)return toast("Nama wajib diisi.",1);if(!(n>0))return toast("Nominal harus lebih dari 0.",1);if(tgl>today())return toast("Tanggal tidak boleh di masa depan.",1);
  S.dp.unshift({id:uid("DP"),tanggal:tgl,pelanggan:nama,hp,jenis:"Masuk",jumlah:n,ket:"Kelebihan bayar diterima"});persist("dp");toast(`Kelebihan ${rp(n)} dari ${nama} tersimpan.`);render();
}
function dpRefund(n,h,k){
  const amt=+val("ref-"+k)||0,saldo=dpSaldo(n,h);
  if(!(amt>0))return toast("Isi nominal pengembalian.",1);if(amt>saldo)return toast("Nominal melebihi saldo kelebihan.",1);
  const d=today();
  S.dp.unshift({id:uid("DP"),tanggal:d,pelanggan:n,hp:h,jenis:"Dikembalikan",jumlah:amt,ket:"Kelebihan dikembalikan ke pelanggan"});
  S.exp.unshift({id:uid("OUT"),tanggal:d,kategori:REFUND,jumlah:amt,ket:`Pengembalian Kelebihan ${n}`});
  persist("dp","expenses");toast(`Kelebihan ${rp(amt)} dikembalikan ke ${n}.`);render();
}

function pLap(){
  const L=UI.L,cut=S.cutoff,per=period(L.m,L.y,cut),R=calc(per.start,per.end),kas=L.mode==="kas";

  const byLay=S.prices.map(p=>p.key).concat([...new Set(set.map(t=>t.layanan))].filter(k=>!S.prices.some(p=>p.key===k))).map(k=>({k,n:set.filter(t=>t.layanan===k).length,v:sum(set.filter(t=>t.layanan===k),t=>t.total)})).filter(x=>x.n);
  const cats=[...new Set(R.expP.map(e=>e.kategori))].map(k=>({k,v:sum(R.expP.filter(e=>e.kategori===k),e=>e.jumlah)}));
  const cm=new Map();set.forEach(t=>{const k=ckey(t.pelanggan,t.hp);const c=cm.get(k)||{n:t.pelanggan,hp:t.hp,c:0,tot:0,paid:0,sisa:0};c.c++;c.tot+=t.total;const pu=paidUpTo(t,per.end);c.paid+=Math.min(t.total,pu);c.sisa+=Math.max(0,t.total-pu);cm.set(k,c)});
  const pc=[...cm.values()].sort((a,b)=>b.tot-a.tot);

Alamat: ${S.profile.alamat||"-"} • WA: ${S.profile.wa||"-"}

Pemasukan (nota lunas di periode): ${rp(snap.pemasukanKas)}

  return snap;
}

/* ---------- CSV ---------- */
const q=v=>{const s=String(v??"");return/[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
function parseCSV(t){const rows=[];let r=[],c="",inq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(inq){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else inq=false}else c+=ch}else if(ch==='"')inq=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"){r.push(c);c="";rows.push(r);r=[]}else if(ch!=="\r")c+=ch}if(c!==""||r.length){r.push(c);rows.push(r)}return rows.filter(x=>!(x.length===1&&x[0].trim()===""))}
function exportCSV(){
  const H=["ID","Tanggal","Pelanggan","HP","Layanan","Qty","Harga","Diskon","Ongkir","Total","DPTerpakai","Status","Metode","TanggalDiambil","PaymentsJSON"];
  const lines=["TRANSAKSI",H.map(q).join(","),...S.tx.map(t=>[t.id,t.tanggal,t.pelanggan,t.hp,t.layanan,t.qty,t.harga,t.diskon,t.ongkir,t.total,t.dpTerpakai,t.status,t.metode,t.tanggalDiambil,JSON.stringify(t.payments)].map(q).join(",")),"",
   "DP",["ID","Tanggal","Pelanggan","HP","Jenis","Jumlah","Keterangan","TransaksiID"].map(q).join(","),...S.dp.map(r=>[r.id,r.tanggal,r.pelanggan,r.hp,r.jenis,r.jumlah,r.ket,r.transaksiId||""].map(q).join(",")),"",
   "PENGELUARAN",["ID","Tanggal","Kategori","Jumlah","Keterangan"].map(q).join(","),...S.exp.map(e=>[e.id,e.tanggal,e.kategori,e.jumlah,e.ket].map(q).join(","))];
  download(new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"}),`${clean(S.profile.nama).replace(/\s+/g,"-")||"NY"}-${today()}.csv`);toast("CSV diunduh (Transaksi, Kelebihan, Pengeluaran).");
}
function importCSV(text){
  try{
    const rows=parseCSV(text.replace(/^\ufeff/,""));let sec="";const hdr={},data={TRANSAKSI:[],DP:[],PENGELUARAN:[]};
    for(const r of rows){const a=(r[0]||"").trim().toUpperCase();if(r.length===1&&data[a]){sec=a;continue}if(!sec)continue;if(!hdr[sec]){hdr[sec]=r.map(x=>x.trim().toLowerCase());continue}data[sec].push(r)}
    const col=(sec,r,...names)=>{const h=hdr[sec];for(const n of names){let i=h.indexOf(n);if(i<0)i=h.findIndex(x=>x.startsWith(n));if(i>=0)return r[i]??""}return""};
    if(!hdr.TRANSAKSI&&!hdr.DP&&!hdr.PENGELUARAN)throw 0;
    const ids=new Set(S.tx.map(t=>t.id)),dids=new Set(S.dp.map(r=>r.id)),eids=new Set(S.exp.map(e=>e.id)),remap=new Map();
    const T=[],D=[],E=[];
    (hdr.TRANSAKSI?data.TRANSAKSI:[]).forEach(r=>{const g=(...n)=>col("TRANSAKSI",r,...n);let id=g("id");if(!id)return;if(ids.has(id)){const old=id;id=nextIdFrom([...ids]);remap.set(old,id)}ids.add(id);let pays=[];try{pays=JSON.parse(g("paymentsjson")||"[]")}catch{}
      T.push(normTx({id,tanggal:g("tanggal")||today(),pelanggan:g("pelanggan"),hp:g("hp"),layanan:g("layanan"),qty:g("qty"),harga:g("harga"),diskon:g("diskon"),ongkir:g("ongkir"),total:g("total"),dpTerpakai:g("dpterpakai","dp terpakai"),status:g("status"),metode:g("metode"),tanggalDiambil:g("tanggaldiambil"),dp:g("dp dibayar"),kelebihanDP:g("kelebihan"),kembalian:g("kembalian"),payments:pays}))});
    (hdr.DP?data.DP:[]).forEach(r=>{const g=(...n)=>col("DP",r,...n);let id=g("id");if(!id)return;if(dids.has(id))id=uid("DP");dids.add(id);const tid=g("transaksiid");D.push({id,tanggal:g("tanggal")||today(),pelanggan:g("pelanggan"),hp:g("hp"),jenis:g("jenis")||"Masuk",jumlah:+g("jumlah")||0,ket:g("keterangan"),transaksiId:tid?(remap.get(tid)||tid):undefined})});
    (hdr.PENGELUARAN?data.PENGELUARAN:[]).forEach(r=>{const g=(...n)=>col("PENGELUARAN",r,...n);let id=g("id");if(!id)return;if(eids.has(id))id=uid("OUT");eids.add(id);E.push({id,tanggal:g("tanggal")||today(),kategori:g("kategori")||"Lain-lain",jumlah:+g("jumlah")||0,ket:g("keterangan")})});
    if(!T.length&&!D.length&&!E.length)throw 0;
    S.tx=[...T,...S.tx];S.dp=[...D,...S.dp];S.exp=[...E,...S.exp];persist("transactions","dp","expenses");render();
    toast(`Import: ${T.length} transaksi, ${D.length} kelebihan, ${E.length} pengeluaran.`);
  }catch{toast("Import gagal: format CSV tidak dikenali. Data lama tidak diubah.",1)}
}
function nextIdFrom(list){const n=Math.max(0,...list.map(i=>{const m=/^NY-(\d+)$/.exec(i);return m?+m[1]:0}));return"NY-"+String(n+1).padStart(3,"0")}

/* ---------- aksi (event delegation) ---------- */
const acts={
  noop(){},
  go(d){go(d.p)},
  close(){closeModal()},
  askyes(){const r=M.ask;closeModal();r&&r(true)},
  askno(){const r=M.ask;closeModal();r&&r(false)},
  selall(){const t=$("#manual");t&&(t.focus(),t.select())},
  days(d){UI.days=+d.n;render()},
  ksave:kasirSave,
  kreset(){render();toast("Form direset.")},
  detail(d){showDetail(d.id)},
  lunasi(d){payModal(d.id)},
  quick(d){const e=$("#pay-nom");e.value=d.v;payPreview()},
  payok:paySave,
  edit(d){editModal(d.id)},
  editok:editSave,
  del(d){delTx(d.id)},
  rawbt(d){const t=S.tx.find(x=>x.id===d.id);t&&rawbt(receipt(t))},
  copyrc(d){const t=S.tx.find(x=>x.id===d.id);t&&copyText(receipt(t),"Struk tersalin — tempel di RawBT / WA")},
  printrc(d){const t=S.tx.find(x=>x.id===d.id);t&&printText(receipt(t),"Nota "+t.id)},
  filt(d){UI[d.g]=d.v;render()},
  freset(){UI.q="";UI.fbayar="";UI.fstat="";UI.fbulan="";render()},
  kadd(){const box=$("#k-items");if(box)box.insertAdjacentHTML("beforeend",kItemRowHTML(S.prices[0]?.key||"",1));kasirUpdate()},
  kdel(){const rows=[...document.querySelectorAll(".k-item")];if(rows.length<=1)return toast("Minimal 1 layanan.",1);const row=event?.target?.closest?.(".k-item");if(row)row.remove();kasirUpdate()},
  dpadd:dpAdd,
  dpnota(d){go("kasir");$("#k-nama").value=d.n;$("#k-hp").value=d.h;kasirUpdate()},
  dpbukti(d){copyText(`BUKTI DP ${S.profile.nama}\nPelanggan: ${d.n}\nHP: ${d.h||"-"}\nTanggal: ${fmt(today())}\nSaldo Kelebihan: ${rp(dpSaldo(d.n,d.h))}\nKelebihan terpotong otomatis di kunjungan berikutnya.`,"Bukti DP tersalin")},
  dpref(d){dpRefund(d.n,d.h,d.k)},
  expadd(){const x=expRead();if(!x)return;S.exp.unshift({id:uid("OUT"),...x});persist("expenses");toast("Pengeluaran tersimpan.");render()},
  expedit(d){const e=S.exp.find(x=>x.id===d.id);if(!e)return;openModal(`<h3>Edit Pengeluaran</h3>${expForm(e)}<div class="row"><button class="btn d grow" data-act="expok" data-id="${esc(e.id)}">Simpan</button><button class="btn" data-act="close">Batal</button></div>`)},
  expok(d){const x=expRead();if(!x)return;const e=S.exp.find(y=>y.id===d.id);Object.assign(e,x);persist("expenses");closeModal();toast("Pengeluaran diperbarui.");render()},
  async expdel(d){const e=S.exp.find(x=>x.id===d.id);if(!e||!await ask("Hapus pengeluaran?",`${e.kategori} • ${rp(e.jumlah)}`,"Ya, Hapus"))return;closeModal();const snap=[...S.exp];S.exp=S.exp.filter(x=>x.id!==d.id);persist("expenses");render();toast("Pengeluaran dihapus",0,()=>{S.exp=snap;persist("expenses");render()})},
  mprev(){const L=UI.L;if(--L.m<1){L.m=12;L.y--}render()},
  mnext(){const L=UI.L;if(++L.m>12){L.m=1;L.y++}render()},
  mode(d){UI.L.mode=d.v;render()},
  rmode(d){UI.L.rekap=d.v;render()},
  rekap(){const s=makeSnap();s&&showRekap(s,false)},
  rview(d){const s=S.recaps.find(r=>r.id===d.id);s&&showRekap(s,true)},
  rcopy(){copyText(M.snap.teks,"Rekap tersalin")},
  rprint(){printText(M.snap.teks,"Rekap")},
  rsave(){S.recaps.unshift(M.snap);persist("recaps");toast("Rekap disimpan ke riwayat.");const s=M.snap;render();showRekap(s,true)},
  async rdel(d){if(!await ask("Hapus riwayat rekap?","Snapshot ini akan dihapus.","Ya, Hapus"))return;closeModal();S.recaps=S.recaps.filter(r=>r.id!==d.id);persist("recaps");render()},
  sprof(){const n=val("s-nama").trim();if(!n)return toast("Nama laundry tidak boleh kosong.",1);S.profile={nama:n,wa:val("s-wa").trim(),alamat:val("s-alamat").trim(),slogan:val("s-slogan").trim()};persist("profile");toast("Profil tersimpan.");render()},
  psat(d){UI.draft[+d.i].satuan=d.v;render()},
  pdel(d){UI.draft.splice(+d.i,1);render()},
  padd(){UI.draft.push({key:"",harga:"0",satuan:"/pcs"});render()},
  pdef(){UI.draft=DEF_PRICES.map(x=>({key:x.key,harga:String(x.harga),satuan:x.satuan}));render();toast("Harga default dimuat — tekan Simpan untuk menerapkan.")},
  psave(){
    const d=UI.draft;if(!d.length)return toast("Minimal satu layanan.",1);
    for(const[i,x]of d.entries()){if(!x.key.trim())return toast(`Layanan ke-${i+1}: nama kosong.`,1);if(x.harga===""||isNaN(+x.harga)||+x.harga<0)return toast(`"${x.key}": harga tidak valid.`,1)}
    const k=d.map(x=>x.key.trim().toLowerCase());if(new Set(k).size!==k.length)return toast("Nama layanan tidak boleh kembar.",1);
    S.prices=d.map(x=>({key:x.key.trim(),harga:+x.harga,satuan:x.satuan}));persist("prices");toast("Daftar harga tersimpan.");render()},
  scut(){S.cutoff=+val("s-cut");persist("closing_day");toast(S.cutoff?`Rekap ditutup tiap tanggal ${S.cutoff}.`:"Rekap memakai kalender bulan.")},
  async clogin(){
    const url=val("c-url").trim().replace(/\/$/,""),key=val("c-key").trim(),mail=val("c-mail").trim(),pass=val("c-pass");
    if(!url||!key)return toast("Isi Project URL dan Anon key.",1);
    localStorage.setItem(CFG_KEY,JSON.stringify({url,anonKey:key}));
    if(!mail||!pass)return toast("Konfigurasi disimpan. Isi email & password untuk login.");
    try{const{createClient}=await import("https://esm.sh/@supabase/supabase-js@2");const c=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});
      let{error}=await c.auth.signInWithPassword({email:mail,password:pass});
      if(error){const r=await c.auth.signUp({email:mail,password:pass});if(r.error)throw error}
      toast("Login berhasil. Memuat ulang…");setTimeout(()=>location.reload(),900)
    }catch(e){toast("Login gagal: "+(e.message||e),1)}},
  async clogout(){try{if(cloud.client)await cloud.client.auth.signOut()}catch{}localStorage.removeItem(CFG_KEY);toast("Cloud diputus. Data tetap ada di HP.");setTimeout(()=>location.reload(),700)},
  export:exportCSV,
  import(){$("#imp").click()},
  async wipe(){
    if(!await ask("Hapus SEMUA data?","Transaksi, kelebihan, pengeluaran, dan riwayat rekap dihapus dari HP ini (dan cloud bila aktif). Export CSV dulu! Profil & harga tetap.","Ya, Hapus Semua"))return;
    S.tx=[];S.dp=[];S.exp=[];S.recaps=[];persist("transactions","dp","expenses","recaps");toast("Semua data operasional dihapus.");render()},
};
window.kasirUpdate=kasirUpdate;
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const f=acts[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}});
document.addEventListener("input",e=>{
  const t=e.target,k=t.dataset?.live;
  if(t.closest&&t.closest("#kform"))return kasirUpdate();
  if(!k)return;
  if(k==="q"){UI.q=t.value;const p=t.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}
  else if(k==="dq"||k==="cq"){UI[k]=t.value;const p=t.selectionStart;render();const n=document.querySelector(`[data-live=${k}]`);n.focus();n.setSelectionRange(p,p)}
  else if(k==="pay"){if(t.id==="pay-nom")payPreview()}
  else if(k==="e")editPreview();
  else if(k==="pd"){UI.draft[+t.dataset.i][t.dataset.f]=t.value}
});
document.addEventListener("change",e=>{
  const t=e.target,k=t.dataset?.live;
  if(t.closest&&t.closest("#kform"))return kasirUpdate();
  if(t.id==="k-nama"){const h=customers().filter(c=>c.nama.toLowerCase()===t.value.trim().toLowerCase());if(h.length===1&&!val("k-hp"))$("#k-hp").value=h[0].hp;kasirUpdate()}
  if(t.id==="pay-ambil")t.dataset.touched=1;
  if(t.name==="pay-ex")payPreview();
  if(t.id==="pay-tgl")payPreview();
  if(k==="status"){const x=S.tx.find(y=>y.id===t.dataset.id);if(x){x.status=t.value;x.tanggalDiambil=t.value==="Diambil"?(x.tanggalDiambil||today()):"";persist("transactions");render();if(M.id===x.id)showDetail(x.id)}}
  if(k==="fbulan"){UI.fbulan=t.value;render()}
  if(k==="lm"){UI.L.m=+t.value;render()}
  if(k==="ly"){UI.L.y=+t.value;render()}
  if(k==="rfrom"){UI.L.from=t.value||UI.L.from}
  if(k==="rto"){UI.L.to=t.value||UI.L.to}
  if(t.id==="imp"&&t.files[0]){const f=new FileReader;f.onload=()=>importCSV(String(f.result));f.readAsText(t.files[0]);t.value=""}
});

/* ---------- start ---------- */
await cloudStart();
loadState();
render();
</script>
